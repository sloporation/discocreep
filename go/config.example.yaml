# Example configuration for the watcher, worker and API. Copy to config.yaml and fill in.
# Any field below can also be supplied via a BXT_-prefixed env var
# (e.g. BXT_DISCORD_TOKEN or BXT_DB_HOST), which take precedence over this file.

discord:
  token: ""        # Bot token from the Discord Developer Portal
  client_id: ""    # Application ID
  guild_id: ""     # Optional dev guild ID; if set, commands register per-guild (instant) instead of globally
  client_secret: "" # OAuth2 client secret; only the web API uses it (Discord login)

db:
  host: localhost
  port: 3306
  user: discordbot
  password: ""
  name: discordbot
  pool_size: 5

# Redis/Valkey that carries events from the watcher to workers.
redis:
  addr: localhost:6379
  password: ""
  db: 0

queue:
  partitions: 16   # must match between the watcher and all workers

# Web API (cmd/api).
api:
  listen: ":8080"
  public_url: http://localhost:8080   # add <public_url>/auth/callback as an OAuth2 redirect in the Developer Portal
  web_url: http://localhost:5173      # the web app; only origin allowed to call the API

steam:
  api_key: ""   # optional Steam Web API key: shows linked accounts' names and avatars
