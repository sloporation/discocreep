server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Runtime config: always fetch fresh so an API URL change applies at once.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths get index.html (the app routes itself).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
