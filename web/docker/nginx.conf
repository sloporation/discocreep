server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Every location includes the security headers (written at startup by
    # 40-config.sh): nginx drops inherited add_headers in any block that
    # sets its own.

    # Runtime config: always fetch fresh so an API URL change applies at once.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths get index.html (the app routes itself).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
