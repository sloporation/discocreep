stages:
  - container

.docker:
  image: docker:27.0
  stage: container
  services:
    - docker:24.0.5-dind
  variables:
    IMAGE_TAG: "latest"
    DOCKER_BUILDKIT: "1"
  before_script:
    - export CONTAINER_NAME="${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
  script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" --password-stdin
    - docker buildx create --name multiarch --driver docker-container --use
    - docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile --tag "${CONTAINER_NAME}" --push .

build-latest:
  extends: .docker
  variables:
    IMAGE_TAG: latest
  only:
    - main

build-branch:
  extends: .docker
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  only:
    - branches
  except:
    - main

build-tags:
  extends: .docker
  variables:
    IMAGE_TAG: ${CI_COMMIT_TAG}
  only:
    - tags
