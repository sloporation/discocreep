# FOR DEVELOPMENT ONLY. Builds and runs this checkout so you can test
# changes locally; it isn't a way to deploy the bot. Deployments use a
# release's images (ghcr.io/sloporation/discocreep:<version> and
# discocreep-web:<version>) or binaries from GitHub Releases. Databases
# created from here are disposable and may not upgrade to a release.
#
# The bot runs as three kinds of process sharing one image:
#   watcher - holds the Discord gateway connection and publishes every event
#             to Valkey. Run exactly one.
#   worker  - runs the features and replies to Discord. Scale freely, e.g.
#             `docker compose up -d --scale worker=3`; workers share the
#             event partitions between them.
#   api     - the web API used by the web app (web/): Discord login and
#             guild settings. Stateless apart from Valkey and MariaDB.
# plus:
#   web     - the React web app (static files served by nginx), on :5173.
x-bot: &bot
  build:
    # Build context is the repo root so the Dockerfile can COPY go/ in
    # one go. The Dockerfile itself lives under docker/.
    context: .
    dockerfile: docker/Dockerfile
  image: discocreep-bot
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # Default to the bundled Valkey so an existing .env keeps working.
    BXT_REDIS_ADDR: ${BXT_REDIS_ADDR:-valkey:6379}
  # Optional: mount a config.yaml into the container and tell the bot to
  # read it. Useful if you'd rather keep config out of env vars. Any
  # BXT_* env still override the file.
  # volumes:
  #   - ./config.yaml:/config.yaml:ro
  # command: ["-config", "/config.yaml"]

services:
  watcher:
    <<: *bot
    entrypoint: ["/usr/local/bin/watcher"]
    depends_on:
      valkey:
        condition: service_healthy

  worker:
    <<: *bot
    entrypoint: ["/usr/local/bin/worker"]
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  api:
    <<: *bot
    entrypoint: ["/usr/local/bin/api"]
    ports:
      - "${BXT_API_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:
    build:
      context: ./web
    image: discocreep-web
    restart: unless-stopped
    ports:
      - "${BXT_WEB_PORT:-5173}:80"
    environment:
      # The API's URL as the browser reaches it (not the container network).
      BXT_API_URL: ${BXT_API_PUBLIC_URL:-http://localhost:8080}

  # Carries events from the watcher to workers (Redis Streams). Valkey is the
  # BSD-licensed Redis fork; any Redis 7+ works too (set BXT_REDIS_ADDR).
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    # Append-only file: queued events survive a Valkey restart (at most
    # ~1s of events can be lost on a crash).
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # MariaDB's image init reads MARIADB_*; the bot reads BXT_DB_*.
      # We bridge them here so a single set of BXT_DB_* keys in .env
      # configures both. BXT_DB_HOST (e.g. "mariadb") is consumed only
      # by the bot, not by the DB image itself.
      MARIADB_ROOT_PASSWORD: ${BXT_DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${BXT_DB_NAME:-discordbot}
      MARIADB_USER: ${BXT_DB_USER:-discordbot}
      MARIADB_PASSWORD: ${BXT_DB_PASSWORD:-change_this_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
  valkey_data:
